[project]
name = "darwin"
version = "1.2.0"
description = "Process and visualize measured and simulated data in the project DARWIN."
authors = [{ name = "Benjamin Schmidt", email = "benschmidt@live.de" }]
requires-python = ">=3.14,<3.15"
readme = "README.md"
license-files = ["uc2-data-standard.pdf", "uc2-datenstandard.pdf"]
# Runtime prerequisites of the supported interface only (darwin.operations,
# darwin.comparison, darwin.simulation_output, darwin.observation_qc, the
# publisher and the darwin.wrf_products diagnostics/aggregation). Historical
# research, native-library and plotting modules need extras; so does the
# georeferenced GAR writer behind darwin.wrf_products derive (pyproj, `native`
# extra) and native MCAPE/MCIN/SLP. pandas is already required by xarray; it is
# declared because darwin.wrf_products uses its calendar offsets directly (the
# `research` extra repeats it from before; harmless).
dependencies = [
    "cryptography>=46",
    "jsonschema>=4.25.1",
    "netCDF4>=1.7.5",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "xarray>=2026.9.0",
    "zarr>=3.4.1",
]

[project.optional-dependencies]
research = [
    "cdsapi>=0.7.7",
    "cf-xarray>=0.11.3",
    "cftime>=1.6.6.1",
    "dask>=2026.8.0",
    "dotenv>=0.9.9",
    "ipython>=9.17.1",
    "joblib>=1.6.0",
    "metpy>=1.7.1",
    "pandas>=3.0.6",
    "pint-xarray>=0.6.1",
    "pint>=0.26.2",
    "prettyprint>=0.1.5",
    "scikit-image>=0.26.0",
    "statsmodels>=0.15.0",
    "tomli>=2.5.0",
    "typer>=0.27.3",
]
native = [
    "cdo>=1.6.1",
    "elevation>=2.0.1",
    "geopandas>=1.2.0",
    "pyproj>=3.8.0",
    "rasterio>=1.5.2",
    "rioxarray>=0.23.0",
    "salem>=0.3.11",
    "shapely>=2.2.0",
]
visualization = [
    "cartopy>=0.26.0",
    "contextily>=1.7.1",
    "descartes>=1.1.0",
    "matplotlib>=3.11.2",
    "nc-time-axis>=1.4.1",
    "pyqt6>=6.11.0",
    "seaborn>=0.13.2",
    "windrose>=1.10.0",
]
all = ["darwin[research,native,visualization]"]

[dependency-groups]
test = [
    "darwin[all]",
    "packaging>=25.0",
    "pytest>=9.1.1",
    "pytest-mock>=3.17.0",
]
dev = [
    "icecream>=2.2.0",
    "pandas-stubs>=3.0.5.260914",
]

[tool.uv]
default-groups = [
    "test",
    "dev",
]

[tool.hatch.build.targets.sdist]
include = ["/darwin", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["darwin"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
python_executable = "python"

[tool.pylint.main]
fail-under = 10
ignore = ["CVS"]
ignore-patterns = ["^\\.#"]
jobs = 1

limit-inference-results = 100
persistent = true

py-version = "3.14"

suggestion-mode = true

[tool.pylint.basic]
argument-naming-style = "snake_case"

attr-naming-style = "snake_case"

bad-names = ["foo", "bar", "baz", "toto", "tutu", "tata"]
class-attribute-naming-style = "any"
class-const-naming-style = "UPPER_CASE"
class-naming-style = "PascalCase"
class-rgx = "[A-Z][a-z]+"
const-naming-style = "UPPER_CASE"
docstring-min-length = -1
function-naming-style = "snake_case"
good-names = ["ax", "ds", "df", "i", "j", "k", "ex", "Run", "_"]
inlinevar-naming-style = "any"
method-naming-style = "snake_case"
module-naming-style = "snake_case"
no-docstring-rgx = "^_"
property-classes = ["abc.abstractproperty"]
variable-naming-style = "snake_case"

[tool.pylint.classes]
defining-attr-methods = ["__init__", "__new__", "setUp", "__post_init__"]
exclude-protected = ["_asdict", "_fields", "_replace", "_source", "_make"]
valid-classmethod-first-arg = ["cls"]
valid-metaclass-classmethod-first-arg = ["cls"]

[tool.pylint.design]
# Maximum number of arguments for function / method.
max-args = 5
# Maximum number of attributes for a class (see R0902).
max-attributes = 7
# Maximum number of boolean expressions in an if statement (see R0916).
max-bool-expr = 5
# Maximum number of branch for function / method body.
max-branches = 12
# Maximum number of locals for function / method body.
max-locals = 15
# Maximum number of parents for a class (see R0901).
max-parents = 7
# Maximum number of public methods for a class (see R0904).
max-public-methods = 20
# Maximum number of return / yield for function / method body.
max-returns = 6
# Maximum number of statements in function / method body.
max-statements = 50
# Minimum number of public methods for a class (see R0903).
min-public-methods = 2

[tool.pylint.exceptions]
# Exceptions that will emit a warning when caught.
overgeneral-exceptions = ["BaseException", "Exception"]

[tool.pylint.format]
# Regexp for a line that is allowed to be longer than the limit.
ignore-long-lines = "^\\s*(# )?<?https?://\\S+>?$"
indent-after-paren = 4
indent-string = "    "
max-line-length = 100
max-module-lines = 1000

[tool.pylint.logging]
logging-modules = ["logging"]

[tool.pylint.miscellaneous]
# List of note tags to take in consideration, separated by a comma.
notes = ["FIXME", "TODO", "NOTE"]

[tool.pylint.refactoring]
max-nested-blocks = 5
never-returning-functions = ["sys.exit", "argparse.parse_error"]

[tool.pylint.reports]
evaluation = "max(0, 0 if fatal else 10.0 - ((float(5 * error + warning + refactor + convention) / statement) * 10))"
score = true

[tool.pylint.similarities]
ignore-comments = true
ignore-docstrings = true
ignore-imports = true
ignore-signatures = true
min-similarity-lines = 4

[tool.flake8]
max-line-length = 100
max-complexity = 10

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = ["F841"]
select = [
  "ALL",
]
ignore = [
  "ERA001",
  "COM812",
  "TD002",
  "TD003",
  "FIX",
  "D107",
  "W292",
	"D413",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S101", "D103"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 40

[tool.isort]
line_length = 80
profile = "black"

[tool.basedpyright]
include = ["darwin"]
exclude = [
  "**/node_modules",
  "**/__pycache__",
  "darwin/experimental",
  "darwin/typestubs",
]
stubPath = "/home/ben/.local/src/python-type-stubs/stubs"
extraPaths = ["../salem"]

reportMissingImports = "error"
reportMissingTypeStubs = true
reportUnusedCallResult = false
reportAny = false
reportUndefinedVariable = true
reportUnusedImport = false

autoImportCompletions = true
typeCheckingMode = "off"
useLibraryCodeForTypes = true
allowUntypedLibraries = true
