# Smoke T1 (darwin#23): reviewed Jan-2020 precipitation smoke manifest.
#
# REVIEW: approved for the smoke slice only — five small products built
# from repo-local source bytes so the dashboard tickets can exercise the
# catalogue, Explore, Admin, comparison and job seams end to end.
# T4 correction re-reviewed: the slice fixed range is [0, 2] mm/h against
# the measured source max 1.65 mm/h ([0, 600] rendered the slice flat);
# the Normal product keeps [0, 600] for monthly totals.
# Any change re-binds `revision` (sha256 of these exact bytes) and needs
# a fresh review before the release is rebuilt.
#
# Source paths are relative to the repository root; each sha256 was
# recorded from the reviewed bytes and is re-verified by
# tests/test_smoke_release.py.

