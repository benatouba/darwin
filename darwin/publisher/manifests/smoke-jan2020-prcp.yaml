# Smoke T1 (darwin#23): reviewed Jan-2020 precipitation smoke manifest.
#
# REVIEW: approved for the smoke slice only — five small products built
# from repo-local source bytes so the dashboard tickets can exercise the
# catalogue, Explore, Admin, comparison and job seams end to end.
# T4 correction re-reviewed: the slice fixed range is [0, 2] mm/h against
# the measured source max 1.65 mm/h ([0, 600] rendered the slice flat);
# the Normal product keeps [0, 600] for monthly totals.
# T6 addition re-reviewed: two comparison-series products (GAR sampled
# nearest the Station location record, AWS January-2025 tip sums) plus a
# pointer update on the comparison-spec; same version label, so revision
# re-binds and the release is rebuilt.
# Aggregation contract (dashboard#16) re-reviewed: each product declares its permitted
# time-span aggregations (method, target interval, missing-data
# semantics); a consumer must never aggregate outside the declaration.
# Precipitation products permit sums over daily/monthly spans requiring
# complete inputs; the Normal permits an annual sum; the sampled series
# permits an annual mean excluding missing inputs; the static mask and
# the comparison-spec permit no time-span aggregation.
# Any change re-binds `revision` (sha256 of these exact bytes) and needs
# a fresh review before the release is rebuilt.
#
# Source paths are relative to the repository root; each sha256 was
# recorded from the reviewed bytes and is re-verified by
# tests/test_smoke_release.py.

name: smoke-jan2020-prcp
release: smoke1
sources:
  - path: GAR_d02km_static_landmask.nc
    sha256: 3b1df65920ba0ec31c27ea7425ac5dbdb9e9562862275e4e6691336beb0fc4db
  - path: GAR_d02km_m_2d_prcp_2020.nc
    sha256: 5fb7bcbaed6a3b3d4df4f03455ce2acc1f7c424e7a33c5799888d2b122465adf
  - path: data/11_AWS-PCerroCrocker_data.csv
    sha256: ebd57825e5ba3566e5a369f1aa425097fb67c8bd6735f9f672062317d0ab5667
products:
  - product_id: GAR_d02km_static_landmask
    kind: reference
    citation: "GAR static land mask, 2 km domain (GAR_d02km_static_landmask.nc)"
    variable: "landmask"
    domain: "d02km"
    format: "netcdf"
    palette: "Greys"
    transform: "linear"
    color_range: [0.0, 1.0]
    uris: {analysis: "s3://darwin-published/GAR_d02km_static_landmask/1/analysis.zarr"}
  - product_id: GAR_d02km_m_2d_prcp_2020-01
    kind: slice
    citation: "GAR monthly precipitation, January 2020, 2 km domain (GAR_d02km_m_2d_prcp_2020.nc)"
    variable: "prcp"
    domain: "d02km"
    format: "zarr-v3-consolidated"
    palette: "Blues"
    transform: "linear"
    color_range: [0.0, 2.0]
    uris: {analysis: "s3://darwin-published/GAR_d02km_m_2d_prcp_2020-01/1/analysis.zarr"}

    aggregations:
      - method: sum
        interval: daily
        missing_data: require-complete
      - method: sum
        interval: monthly
        missing_data: require-complete
  - product_id: GAR_d02km_prcp_sum_1991-2020_01
    kind: normal
    citation: "GAR January precipitation Climate normal over 1991-2020, 2 km domain"
    normal_period: "1991-2020"
    method: "prcp: monthly mean rate multiplied by calendar hours, averaged by calendar month"
    variable: "prcp_sum"
    domain: "d02km"
    format: "zarr-v3-consolidated"
    palette: "Blues"
    transform: "linear"
    color_range: [0.0, 600.0]
    uris: {analysis: "s3://darwin-published/GAR_d02km_prcp_sum_1991-2020_01/1/analysis.zarr"}

    aggregations:
      - method: sum
        interval: annual
        missing_data: require-complete
  - product_id: AWS-PCerroCrocker_2020-01
    kind: observation
    citation: >-
      AWS observation product for the CerroCrocker Station location
      record, January 2020 (data/11_AWS-PCerroCrocker_data.csv)
    station_id: "11_AWS-PCerroCrocker"
    variable: "pcp"
    domain: "d02km"
    format: "csv"
    palette: "Blues"
    transform: "linear"
    color_range: [0.0, 600.0]
    uris: {analysis: "s3://darwin-published/AWS-PCerroCrocker_2020-01/1/analysis.zarr"}

    aggregations:
      - method: sum
        interval: daily
        missing_data: require-complete
      - method: sum
        interval: monthly
        missing_data: require-complete
  - product_id: AWS-CerroCrocker_2025-01
    kind: observation
    citation: >-
      AWS observation product for the CerroCrocker Station location
      record, January 2025 (data/11_AWS-PCerroCrocker_data.csv)
    station_id: "11_AWS-PCerroCrocker"
    variable: "pcp"
    domain: "d02km"
    format: "csv"
    palette: "Blues"
    transform: "linear"
    color_range: [0.0, 600.0]
    uris: {analysis: "s3://darwin-published/AWS-CerroCrocker_2025-01/1/analysis.zarr"}

    aggregations:
      - method: sum
        interval: daily
        missing_data: require-complete
      - method: sum
        interval: monthly
        missing_data: require-complete
  - product_id: GAR-CerroCrocker-sampled_2020
    kind: sampled
    citation: >-
      GAR station-sampled product: monthly precipitation sampled
      nearest the CerroCrocker Station location record, full year 2020
      (GAR_d02km_m_2d_prcp_2020.nc)
    method: "nearest"
    variable: "prcp"
    domain: "d02km"
    format: "zarr-v3-consolidated"
    palette: "Blues"
    transform: "linear"
    color_range: [0.0, 2.0]
    uris: {analysis: "s3://darwin-published/GAR-CerroCrocker-sampled_2020/1/analysis.zarr"}

    aggregations:
      - method: mean
        interval: annual
        missing_data: exclude-missing
  - product_id: CMP_prcp_CerroCrocker_2020-01
    kind: comparison-spec
    citation: >-
      Precipitation Comparison variable specification pairing GAR prcp
      sampled nearest the CerroCrocker Station location record with the
      CerroCrocker January-2025 AWS observation field. Same-month-different-year pairing: the GAR
      January-2020 monthly rate is uniformly disaggregated, so the GAR
      side is constant and correlation is not defined.
    model_product: GAR-CerroCrocker-sampled_2020
    model_variable: prcp
    observation_product: AWS-CerroCrocker_2025-01
    observation_field: PCP_tot_bucket
    variable: "prcp"
    domain: "d02km"
    format: "json"
    palette: "RdBu_r"
    transform: "linear"
    color_range: [-100.0, 100.0]
    uris: {analysis: "s3://darwin-published/CMP_prcp_CerroCrocker_2020-01/1/analysis.zarr"}
